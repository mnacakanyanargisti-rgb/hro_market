<!DOCTYPE html><html lang="hy"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Hro Market — Կառավարում</title><style>
*{box-sizing:border-box}body{margin:0;background:#f1f5f2;color:#16372e;font:16px system-ui,sans-serif}header{background:#102b26;color:white;padding:22px}main{max-width:1000px;margin:auto;padding:18px}section,article{background:white;border:1px solid #dae4dd;border-radius:14px;padding:18px;margin:12px 0}input,select,button{font:inherit;padding:12px;border:1px solid #b6c9bf;border-radius:8px;min-width:0}input:not([type=checkbox]),select{width:100%}button{background:#176a48;color:white;border:0;cursor:pointer}button:disabled{opacity:.5;cursor:wait}.danger{background:#a32e35}.secondary{background:#e6eee9;color:#183f30}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px}label{display:grid;gap:5px;font-size:14px}.toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center}.toolbar input{flex:1}.product{display:grid;grid-template-columns:80px 1fr;gap:12px}.product img{width:80px;height:80px;object-fit:cover;border-radius:9px;background:#eee}.product h3{margin:0 0 6px;font-size:16px}.muted{color:#61756a}.status{min-height:24px}a{color:inherit}dialog{width:min(95vw,620px);max-height:90vh;border:0;border-radius:15px;padding:20px;overflow:auto}dialog::backdrop{background:#102b2699}[hidden]{display:none!important}button:focus-visible,input:focus-visible{outline:3px solid #e0a835}form .toolbar{margin-top:15px}</style><script defer src="admin.js?v=3"></script></head><body><header><strong>HRO MARKET</strong> · Կառավարման բաժին <a style="float:right" href="./">Խանութ</a></header><main><p id="status" class="status" role="status" aria-live="polite"></p><section id="login"><h1>Սեփականատիրոջ մուտք</h1><form id="loginForm"><label>Լոգին<input id="email" type="text" autocomplete="username" autocapitalize="none" spellcheck="false" required></label><br><label>Գաղտնաբառ<input id="password" type="password" autocomplete="current-password" required></label><div class="toolbar"><button>Մուտք գործել</button></div></form></section><section id="panel" hidden><div class="toolbar"><h1 style="flex:1">Ապրանքներ</h1><button id="logout" class="secondary">Ելք</button></div><p class="muted" id="count"></p><div class="toolbar"><input id="search" type="search" placeholder="Փնտրել ապրանք…"><button id="add">+ Ավելացնել</button></div><div id="products"></div></section></main><dialog id="editor"><form id="editForm"><h2 id="editorTitle"></h2><div class="grid"><label>Անուն<input id="name" required maxlength="180"></label><label>Կատեգորիա<select id="category"><option value="produce">Միրգ և բանջարեղեն</option><option value="dairy">Կաթնամթերք և մթերք</option><option value="sweets">Քաղցրավենիք</option><option value="drinks">Ըմպելիքներ</option><option value="home">Կենցաղային</option></select></label><label>Գին (դրամ, դատարկ՝ ճշտել)<input id="price" type="number" min="0" max="2147483647" step="1"></label><label>Գնի միջակայք (ըստ ցանկության)<input id="priceLabel" maxlength="40" placeholder="150–250"></label><label>Զեղչ (%)<input id="discount" type="number" min="0" max="100" value="0" required></label><label>Նոր նկար (մինչև 5 ՄԲ)<input id="image" type="file" accept="image/jpeg,image/png,image/webp"></label></div><p><label style="display:flex;align-items:center"><input id="available" type="checkbox" checked> Առկա է (ցուցադրել խանութում)</label></p><p id="editStatus" role="status"></p><div class="toolbar"><button id="save">Պահպանել</button><button id="cancel" type="button" class="secondary">Չեղարկել</button></div></form></dialog></body></html>
